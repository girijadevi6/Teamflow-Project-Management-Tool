version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamflow-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - teamflow-db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/teamflow.db
      - SECRET_KEY=${SECRET_KEY:-teamflow-change-me-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  teamflow-db:
